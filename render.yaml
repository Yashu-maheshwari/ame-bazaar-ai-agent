# =========================================================================
# AME Bazaar AI Business Growth Agent - Render Blueprint (render.yaml)
# Author: Gemini (Your AI Mentor & Strategist)
# Version: 3.0 (Cloud Orchestrator + Supabase PostgreSQL Architecture)
# =========================================================================

services:
  # 1. n8n Engine Web Service
  - type: web
    name: ame-bazaar-ai-agent
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: WEBHOOK_URL
        value: https://ame-bazaar-ai-agent.onrender.com
      - key: DATABASE_URL
        sync: false

  # 2. Central Cloud Orchestrator & Webhook Engine
  - type: web
    name: ame-bazaar-orchestrator
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install --only=production || true
    startCommand: node scripts/webhook.js
    healthCheckPath: /health
    envVars:
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: MOCK_DB
        value: "false"
