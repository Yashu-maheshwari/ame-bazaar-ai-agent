# =========================================================================
# AME Bazaar AI Business Growth Agent - Render Blueprint (render.yaml)
# Author: Gemini (Your AI Mentor & Strategist)
# Version: 2.2 (Final - Robust Database Connection)
# =========================================================================
# This version fixes the database connection race condition by using the
# more resilient 'connectionString' instead of the internal host property.
# This ensures the web service can always find the database, even if it's slow to start.
# =========================================================================

services:
  # This section defines the n8n application itself.
  - type: web
    name: ame-bazaar-ai-agent
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    envVars:
      # Sets the timezone to India Standard Time for accurate scheduling.
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      # This is CRITICAL. It tells n8n its own public web address.
      - key: WEBHOOK_URL
        value: https://ame-bazaar-ai-agent.onrender.com
      # This is the NEW, more robust way to connect to the database.
      # n8n automatically understands this single DATABASE_URL variable.
      - key: DATABASE_URL
        fromDatabase:
          name: ame-bazaar-database
          property: connectionString

# This section defines your free, permanent database.
databases:
  - name: ame-bazaar-database
    databaseName: amebazaardb
    user: amebazaaruser
    plan: free

