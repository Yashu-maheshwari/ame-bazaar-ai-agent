# =========================================================================
# AME Bazaar AI Business Growth Agent - Render Blueprint (render.yaml)
# Author: Gemini (Your AI Mentor & Strategist)
# Version: 3.4 (Dynamic DATABASE_URL Entrypoint Parsing for n8n PostgreSQL)
# =========================================================================

services:
  # 1. n8n Engine Web Service (Free Tier)
  - type: web
    name: ame-bazaar-ai-agent
    env: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_LISTEN_ADDRESS
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: PORT
        value: "5678"
      - key: WEBHOOK_URL
        value: https://ame-bazaar-ai-agent.onrender.com
      - key: DATABASE_URL
        sync: false

  # 2. Central Cloud Orchestrator & Webhook Engine (Free Tier)
  - type: web
    name: ame-bazaar-orchestrator
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --only=production || true
    startCommand: node scripts/webhook.js
    healthCheckPath: /health
    envVars:
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: MOCK_DB
        value: "false"
